name: Verify public deployment
on:
  workflow_dispatch:
    inputs:
      frontend:
        description: Frontend HTTPS origin
        required: true
        default: https://sparklens-ajaynalla.onrender.com
      backend:
        description: Backend HTTPS origin
        required: true
        default: https://sparklens-api-ajaynalla.onrender.com
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_deployment.py --frontend "$FRONTEND" --backend "$BACKEND" --output verification.json
        env:
          FRONTEND: ${{ inputs.frontend }}
          BACKEND: ${{ inputs.backend }}
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: verification.json
