# Free compute only. Keep RateLab resources in their existing separate Blueprint.
previews:
  generation: off
services:
  - type: web
    name: sparklens-api-ajaynalla
    runtime: python
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn spark_perf_analyzer.api:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --limit-concurrency 12 --timeout-keep-alive 5
    healthCheckPath: /health
    buildFilter:
      paths: [src/**, requirements.txt, backend-constraints.txt, pyproject.toml, render.yaml]
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ALLOWED_ORIGINS
        value: https://sparklens-ajaynalla.onrender.com
  - type: web
    name: sparklens-ajaynalla
    runtime: static
    branch: main
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npx --yes pnpm@10.28.2 install --frozen-lockfile && npx --yes pnpm@10.28.2 build
    staticPublishPath: dist
    buildFilter:
      paths: [frontend/**, render.yaml]
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_BASE_URL
        value: https://sparklens-api-ajaynalla.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
